# Render Blueprint - deploy backend as a Docker web service
services:
  - type: web
    name: memegenius-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
    disk:
      name: meme-data
      mountPath: /data/memes
      sizeGB: 2
